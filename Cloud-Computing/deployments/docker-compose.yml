# docker-compose.yml
#
# Demonstrates a multi-container, cloud-style deployment: the Flask
# "hello-service" (built from the Dockerfile in this folder) plus a Redis
# service it can use for shared, fast, ephemeral state. This mirrors how a
# real cloud deployment composes several independently-scalable services
# (app tier + cache/data tier) that discover each other by service name
# instead of hardcoded IPs -- the same pattern used by the Kubernetes
# Service object in ../configurations/cloud-deployment-manifest.yaml.
#
# Run:
#   docker compose up --build
# Then visit http://localhost:5000/
#
# Stop and remove containers/network:
#   docker compose down

services:
  # --- Application tier ------------------------------------------------------
  hello-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: hello-service:latest
    ports:
      - "5000:5000"
    environment:
      # Non-secret configuration passed in as environment variables rather
      # than hardcoded in the image -- makes the same image reusable across
      # dev/staging/prod by changing only these values.
      SERVICE_NAME: "hello-service"
      GREETING: "Hello from docker-compose!"
      PORT: "5000"
      REDIS_HOST: "cache"
      REDIS_PORT: "6379"
      # Placeholder only -- never put a real password in a compose file.
      # In real deployments this would come from a secrets manager / an
      # untracked .env file / Kubernetes Secret, not from source control.
      DB_PASSWORD: "YOUR_DB_PASSWORD"
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # --- Data/cache tier ---------------------------------------------------------
  # A second, independently-scalable service -- the multi-container pattern
  # common to cloud deployments (app servers scale separately from the
  # cache/database tier behind them).
  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    environment:
      # redis:7-alpine does not require a password by default; this shows
      # the *pattern* of passing runtime config via environment variables.
      # If you enable `requirepass`, supply it the same way, e.g.:
      #   REDIS_PASSWORD: "YOUR_REDIS_PASSWORD"
      REDIS_PORT: "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - cache-data:/data

volumes:
  cache-data:
